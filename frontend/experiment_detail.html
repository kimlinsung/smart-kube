<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能云边端调度系统 · 实验详情</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/paper_workspace.css" />
</head>
<body data-page="experiment_detail">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">

      <div class="detail-hero" id="hero">
        <span class="exp-avatar" id="heroAvatar">·</span>
        <div class="dh-body">
          <a href="/experiments.html" class="back-link">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回实验列表
          </a>
          <h1 id="expName"><span class="spinner"></span></h1>
          <div id="expMeta" class="dh-meta">加载中…</div>
          <div id="expCounts" class="dh-counts"></div>
        </div>
        <div class="dh-actions">
          <button id="btnEnter" class="primary">进入此实验</button>
          <button id="btnRefresh">刷新</button>
        </div>
      </div>

      <section class="experiment-sharing" id="sharing">
        <div class="experiment-sharing-head">
          <div>
            <span class="eyebrow">COLLABORATION</span>
            <h2>协作与分享</h2>
          </div>
          <span class="sharing-access" id="sharingAccess"></span>
        </div>
        <div id="sharingManager" hidden>
          <div class="collaborator-block">
            <form class="collaborator-form" id="collaboratorForm">
              <label for="collaboratorUsername">协作者</label>
              <input id="collaboratorUsername" name="username" maxlength="100" autocomplete="off" placeholder="输入平台用户名" />
              <button class="primary" type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.4-5 6-5M17 8v8M13 12h8"/></svg>
                添加
              </button>
            </form>
            <div class="collaborator-list" id="collaboratorList"></div>
          </div>
          <div class="share-link-block">
            <div class="share-link-copy"><b>只读分享链接</b><small id="shareState">尚未开启</small></div>
            <div class="share-link-controls">
              <input id="shareUrl" readonly placeholder="开启后生成链接" />
              <button id="copyShare" type="button" hidden title="复制链接" aria-label="复制链接">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
              </button>
              <button class="primary" id="toggleShare" type="button">开启分享</button>
            </div>
          </div>
        </div>
        <div class="sharing-readonly" id="sharingReadonly" hidden>你以协作者身份查看此项目，项目内容为只读。</div>
      </section>

      <section class="experiment-artifacts" id="paperArtifacts" hidden>
        <div class="experiment-artifacts-head">
          <div><span class="eyebrow">PAPER WORKSPACE</span><h2>实验产物与过程</h2></div>
          <a class="button-link" id="paperWorkspaceLink" href="#">返回论文工作区</a>
        </div>
        <div class="experiment-artifact-summary" id="paperSummary"></div>
        <div class="experiment-artifact-grid">
          <div><h3>输入文件</h3><div class="artifact-list" id="paperFiles"></div></div>
          <div><h3>过程记录</h3><ol class="workspace-events" id="paperEvents"></ol></div>
        </div>
        <details class="experiment-report" id="paperReport">
          <summary>最终 Markdown 报告</summary>
          <article class="report-view" id="paperReportBody"></article>
        </details>
      </section>

      <div class="card">
        <div class="card-head">
          <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>实验内的 Units（云 / 边 / 端）</h2>
        </div>
        <div class="card-body flush">
          <table>
            <thead>
              <tr><th>名称</th><th>状态</th><th>节点类型</th><th>节点</th><th>架构</th><th>镜像</th><th>SSH</th><th>类型</th><th>操作</th></tr>
            </thead>
            <tbody id="podsBody"><tr class="loading-row"><td colspan="9"><span class="spinner"></span> 加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<input type="file" id="hiddenUpload" style="display:none" />

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chat.js"></script>
<script>
const EXP_ID = Number(new URLSearchParams(location.search).get('id'));
let CURRENT_POD_FOR_UPLOAD = null;
let DETAIL = null;
let SHARING = null;
let DETAIL_RELOAD_TIMER = null;

function renderHead() {
    const exp = DETAIL.experiment;
    document.getElementById('heroAvatar').textContent = (exp.name || '?').trim().slice(0, 1).toUpperCase();
    document.getElementById('expName').innerHTML =
        escapeHtml(exp.name) + (DETAIL.is_current ? '<span class="current-tag">当前</span>' : '');
    const owner = (ME && ME.role === 'admin') || (ME && exp.user_id !== ME.id)
        ? `用户：<b>${escapeHtml(exp.owner_username || '-')}</b> · ` : '';
    document.getElementById('expMeta').innerHTML =
        `${owner}创建于 ${fmtTime(exp.created_at)} · 容器总数：<b>${exp.total_count}</b>`;
    document.getElementById('expCounts').innerHTML = [
        ['云', exp.cloud_count, 'badge-cloud'],
        ['边', exp.edge_count, 'badge-edge'],
        ['端', exp.device_count, 'badge-device'],
    ].map(([l, n, c]) => `<span class="badge ${c}">${l} ${n}</span>`).join('');
    const enterBtn = document.getElementById('btnEnter');
    if (DETAIL.access_role === 'collaborator') {
        enterBtn.hidden = true;
    } else {
        enterBtn.hidden = false;
        if (DETAIL.is_current) { enterBtn.textContent = '已是当前实验'; enterBtn.disabled = true; }
        else { enterBtn.textContent = '进入此实验'; enterBtn.disabled = false; }
    }
    const canManageSharing = ['owner', 'admin'].includes(DETAIL.access_role);
    document.getElementById('sharingManager').hidden = !canManageSharing;
    document.getElementById('sharingReadonly').hidden = canManageSharing;
    document.getElementById('sharingAccess').textContent = canManageSharing
        ? `${exp.collaborator_count || 0} 位协作者` : '只读协作';
}

function renderSharing() {
    if (!SHARING) return;
    const collaborators = SHARING.collaborators || [];
    document.getElementById('collaboratorList').innerHTML = collaborators.length
        ? collaborators.map(item => `
          <div class="collaborator-item">
            <span class="collaborator-avatar">${escapeHtml((item.name || item.username || '?').slice(0, 1).toUpperCase())}</span>
            <span><b>${escapeHtml(item.name || item.username)}</b><small>@${escapeHtml(item.username)}</small></span>
            <button type="button" data-remove-collaborator="${item.user_id}" title="移除协作者" aria-label="移除 ${escapeHtml(item.username)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
            </button>
          </div>`).join('')
        : '<div class="collaborator-empty">暂无协作者</div>';
    const share = SHARING.share || { enabled: false };
    document.getElementById('shareState').textContent = share.enabled ? '链接已开启' : '尚未开启';
    document.getElementById('shareUrl').value = share.url || '';
    document.getElementById('copyShare').hidden = !share.enabled;
    const toggle = document.getElementById('toggleShare');
    toggle.textContent = share.enabled ? '关闭分享' : '开启分享';
    toggle.classList.toggle('danger', share.enabled);
    document.getElementById('sharingAccess').textContent = `${collaborators.length} 位协作者`;
}

async function loadSharing() {
    if (!DETAIL || !['owner', 'admin'].includes(DETAIL.access_role)) return;
    try {
        SHARING = await API.experimentSharing(EXP_ID);
        renderSharing();
    } catch (error) {
        document.getElementById('collaboratorList').innerHTML = `<div class="collaborator-empty">${escapeHtml(error.message)}</div>`;
    }
}

function copyShareLink() {
    const input = document.getElementById('shareUrl');
    if (!input.value) return;
    const done = () => {
        const button = document.getElementById('copyShare');
        button.classList.add('copied');
        setTimeout(() => button.classList.remove('copied'), 1200);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(input.value).then(done).catch(() => {});
        return;
    }
    input.select();
    document.execCommand('copy');
    input.setSelectionRange(0, 0);
    done();
}

function renderPodRow(p) {
    const isCollaborator = DETAIL.access_role === 'collaborator';
    const sshInfo = p.ssh_port
        ? (isCollaborator
            ? `port:<b>${p.ssh_port}</b> <span style="color:var(--muted-2)">凭证仅所有者可见</span>`
            : `port:<b>${p.ssh_port}</b> user:${p.ssh_user || 'root'} pwd:<code>${escapeHtml(p.ssh_password || '')}</code>`)
        : '<span style="color:var(--muted-2)">-</span>';
    const canOp = ME && (ME.role === 'admin' || String(p.owner_id) === String(ME.id));
    const ops = canOp
        ? `<button class="primary" data-act="shell" data-name="${escapeHtml(p.name)}">Web Shell</button>
           <button data-act="upload" data-name="${escapeHtml(p.name)}">上传</button>
           <button class="danger" data-act="del" data-name="${escapeHtml(p.name)}">删除</button>`
        : `<span style="color:var(--muted-2);font-size:12px;">只读</span>`;
    return `
        <td><code>${escapeHtml(p.name)}</code></td>
        <td>${badgePhase(p.phase, p.name)}</td>
        <td>${badgeNodeType(p.node_type)}</td>
        <td>${escapeHtml(p.node || '-')}</td>
        <td>${escapeHtml(p.arch || '-')}</td>
        <td style="font-size:12px;">${escapeHtml(p.image || '-')}</td>
        <td style="font-size:12px;">${sshInfo}</td>
        <td><span class="badge badge-blue">${escapeHtml(p.kind || '-')}</span></td>
        <td><div class="row-actions">${ops}</div></td>`;
}

function renderPods() {
    const body = document.getElementById('podsBody');
    const pods = DETAIL.pods || [];
    if (!pods.length) {
        body.innerHTML = `<tr><td colspan="9"><div class="empty-state">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>
            <div class="t">该实验暂无 Units</div><div class="s">进入实验后，用右上角「AI 助手」创建资源。</div>
        </div></td></tr>`;
        return;
    }
    body.innerHTML = '';
    groupByNodeType(pods).forEach(({ type, items }) => {
        body.insertAdjacentHTML('beforeend', ntGroupHeaderHTML(type, items.length, 9));
        items.forEach(p => { const tr = document.createElement('tr'); tr.innerHTML = renderPodRow(p); body.appendChild(tr); });
    });
    bindPhaseHover(body);
}

function renderPaperArtifacts() {
    const workspace = DETAIL.paper_workspace;
    const root = document.getElementById('paperArtifacts');
    root.hidden = !workspace;
    if (!workspace) return;
    const statusLabels = { queued: '排队中', running: '执行中', completed: '已完成', failed: '失败', interrupted: '已中断' };
    document.getElementById('paperWorkspaceLink').href = '/paper_workspace.html?id=' + encodeURIComponent(workspace.id);
    document.getElementById('paperSummary').innerHTML = `
      <span><b>${escapeHtml(workspace.mode === 'full' ? '完整流程' : '执行至调度')}</b><small>执行模式</small></span>
      <span><b>${escapeHtml(statusLabels[workspace.status] || workspace.status)}</b><small>工作区状态</small></span>
      <span><b>${(workspace.files || []).length}</b><small>归档文件</small></span>
      <span><b>${(workspace.events || []).length}</b><small>过程事件</small></span>`;
    document.getElementById('paperFiles').innerHTML = (workspace.files || []).map(file => `
      <a class="artifact-item" href="/api/paper/workspaces/${workspace.id}/files/${file.id}/download">
        <span class="artifact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h8l4 4v16H6zM14 2v5h5M9 13h6M9 17h4"/></svg></span>
        <span class="artifact-meta"><b>${escapeHtml(file.original_name)}</b><small>${file.size} B</small></span>
      </a>`).join('') || '<span class="inspector-empty">暂无文件</span>';
    document.getElementById('paperEvents').innerHTML = [...(workspace.events || [])].slice(-10).reverse().map(event => `
      <li class="${escapeHtml(event.event_type)}"><span class="event-node"></span>
        <time class="event-time">${new Date(event.created_at * 1000).toLocaleTimeString('zh-CN', { hour12: false })}</time>
        <span class="event-phase">${escapeHtml(event.phase)}</span><span class="event-content">${escapeHtml(event.content)}</span></li>`).join('');
    const report = document.getElementById('paperReport');
    report.hidden = !workspace.report_md;
    if (workspace.report_md) {
        document.getElementById('paperReportBody').innerHTML = window.marked && window.DOMPurify
            ? DOMPurify.sanitize(marked.parse(workspace.report_md, { gfm: true, breaks: true }))
            : `<pre>${escapeHtml(workspace.report_md)}</pre>`;
    }
}

async function loadDetail(silent = false) {
    try {
        DETAIL = await API.getExperiment(EXP_ID);
        renderHead(); renderPaperArtifacts(); renderPods();
    } catch (e) {
        if (silent) return;
        document.getElementById('expName').textContent = '加载失败';
        document.getElementById('expMeta').innerHTML = `<span style="color:var(--danger);">${escapeHtml(e.message)}</span>`;
        document.getElementById('podsBody').innerHTML = `<tr><td colspan="9" style="color:var(--danger)">${escapeHtml(e.message)}</td></tr>`;
    }
}

document.getElementById('podsBody').addEventListener('click', async e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const act = btn.dataset.act, name = btn.dataset.name;
    if (act === 'del') {
        if (!confirm('确认删除 ' + name + '？')) return;
        try { await API.deleteResource(name); loadDetail(); } catch (err) { alert(err.message); }
    } else if (act === 'shell') {
        window.open('/shell.html?pod=' + encodeURIComponent(name), '_blank');
    } else if (act === 'upload') {
        CURRENT_POD_FOR_UPLOAD = name; document.getElementById('hiddenUpload').click();
    }
});

document.getElementById('hiddenUpload').onchange = async e => {
    const f = e.target.files[0]; if (!f || !CURRENT_POD_FOR_UPLOAD) return;
    try { const r = await API.uploadToPod(f, CURRENT_POD_FOR_UPLOAD, '/tmp'); alert('已上传到 Units' + r.pod_path); }
    catch (err) { alert('上传失败：' + err.message); }
    e.target.value = '';
};

document.getElementById('collaboratorForm').onsubmit = async event => {
    event.preventDefault();
    const input = document.getElementById('collaboratorUsername');
    const username = input.value.trim();
    if (!username) return;
    const button = event.submitter;
    button.disabled = true;
    try {
        const response = await API.addExperimentCollaborator(EXP_ID, username);
        SHARING.collaborators = response.collaborators || [];
        input.value = '';
        renderSharing();
        await loadDetail(true);
    } catch (error) {
        alert('添加失败：' + error.message);
    } finally {
        button.disabled = false;
    }
};

document.getElementById('collaboratorList').onclick = async event => {
    const button = event.target.closest('[data-remove-collaborator]');
    if (!button || !confirm('确认移除此协作者？')) return;
    button.disabled = true;
    try {
        const response = await API.removeExperimentCollaborator(EXP_ID, button.dataset.removeCollaborator);
        SHARING.collaborators = response.collaborators || [];
        renderSharing();
        await loadDetail(true);
    } catch (error) {
        alert('移除失败：' + error.message);
    } finally {
        button.disabled = false;
    }
};

document.getElementById('toggleShare').onclick = async event => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
        if (SHARING?.share?.enabled) {
            if (!confirm('关闭后，现有分享链接将立即失效。确认关闭？')) return;
            await API.disableExperimentShare(EXP_ID);
        } else {
            await API.enableExperimentShare(EXP_ID);
        }
        await loadSharing();
    } catch (error) {
        alert('分享设置失败：' + error.message);
    } finally {
        button.disabled = false;
    }
};
document.getElementById('copyShare').onclick = copyShareLink;

document.getElementById('btnRefresh').onclick = () => loadDetail();
document.getElementById('btnEnter').onclick = async () => {
    try {
        await API.enterExperiment(EXP_ID);
        const me = await API.me(); ME = me; renderShell(me);
        await loadDetail(); window.dispatchEvent(new CustomEvent('experiment:changed'));
    } catch (err) { alert('进入失败：' + err.message); }
};

window.addEventListener('chat:done', () => loadDetail(true));
window.addEventListener('task:update', event => {
    if (Number(event.detail?.experiment_id) !== EXP_ID) return;
    clearTimeout(DETAIL_RELOAD_TIMER);
    DETAIL_RELOAD_TIMER = setTimeout(() => loadDetail(true), 120);
});

(async () => {
    if (!EXP_ID) {
        await loadMe();
        document.getElementById('expName').textContent = '参数缺失';
        document.getElementById('expMeta').textContent = '缺少实验 id';
        document.getElementById('podsBody').innerHTML = '<tr><td colspan="9" style="color:var(--danger)">URL 缺少 ?id= 参数</td></tr>';
        return;
    }
    ME = await loadMe();
    if (!ME) return;
    await loadDetail();
    await loadSharing();
    if (location.hash === '#sharing') document.getElementById('sharing').scrollIntoView();
})();
</script>
</body>
</html>
