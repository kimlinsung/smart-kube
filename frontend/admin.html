<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能云边端调度系统 · 集群管理</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="admin">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">

      <div class="card">
        <div class="card-head">
          <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>集群节点</h2>
          <div class="right"><button id="refreshNodes" class="btn-sm btn-ghost">刷新</button></div>
        </div>
        <div class="card-body flush">
          <table>
            <thead><tr><th>名称</th><th>节点类型</th><th>hostname</th><th>架构</th><th>OS</th><th>Ready</th><th>IP</th><th>version</th><th>操作</th></tr></thead>
            <tbody id="nodesBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chat.js"></script>
<script>
function renderNodeRow(n) {
    const readyBadge = n.ready === 'True'
        ? '<span class="badge dot badge-green">Ready</span>'
        : `<span class="badge dot badge-red">${escapeHtml(n.ready)}</span>`;
    const cordonBadge = n.unschedulable ? ' <span class="badge badge-yellow">封锁</span>' : '';
    const cordonBtn = n.unschedulable
        ? `<button data-act="uncordon" data-name="${escapeHtml(n.name)}">解封</button>`
        : `<button data-act="cordon" data-name="${escapeHtml(n.name)}">封锁</button>`;
    return `
        <td><code>${escapeHtml(n.name)}</code></td>
        <td>${badgeNodeType(n.node_type)}</td>
        <td>${escapeHtml(n.hostname||'-')}</td>
        <td>${escapeHtml(n.arch||'-')}</td>
        <td>${escapeHtml(n.os||'-')}</td>
        <td>${readyBadge}${cordonBadge}</td>
        <td>${escapeHtml(n.internal_ip||'-')}</td>
        <td style="font-size:12px;">${escapeHtml(n.kubelet_version||'-')}</td>
        <td><div class="row-actions">${cordonBtn}<button class="danger" data-act="del" data-name="${escapeHtml(n.name)}">删除</button></div></td>`;
}
async function loadNodes() {
    const body = document.getElementById('nodesBody');
    body.innerHTML = '<tr class="loading-row"><td colspan="9"><span class="spinner"></span> 加载中…</td></tr>';
    try {
        const r = await API.adminNodes();
        body.innerHTML = '';
        groupByNodeType(r.nodes).forEach(({ type, items }) => {
            body.insertAdjacentHTML('beforeend', ntGroupHeaderHTML(type, items.length, 9));
            items.forEach(n => { const tr = document.createElement('tr'); tr.innerHTML = renderNodeRow(n); body.appendChild(tr); });
        });
        if (!r.nodes.length) body.innerHTML = '<tr><td colspan="9" style="color:var(--muted)">暂无节点</td></tr>';
    } catch (e) { body.innerHTML = `<tr><td colspan="9" style="color:var(--danger)">加载失败：${escapeHtml(e.message)}</td></tr>`; }
}
document.getElementById('nodesBody').addEventListener('click', async e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const { act, name } = btn.dataset;
    if (act === 'del') { if (!confirm(`确认从集群删除节点 ${name}？此操作不可逆。`)) return; try { await API.adminDeleteNode(name); loadNodes(); } catch (err) { alert(err.message); } }
    else if (act === 'cordon') { if (!confirm(`封锁节点 ${name}？封锁后不再接受新 Units 调度。`)) return; try { await API.adminCordonNode(name); loadNodes(); } catch (err) { alert(err.message); } }
    else if (act === 'uncordon') { try { await API.adminUncordonNode(name); loadNodes(); } catch (err) { alert(err.message); } }
});

document.getElementById('refreshNodes').onclick = loadNodes;

(async () => {
    const me = await loadMe();
    if (me.role !== 'admin') { alert('需要管理员权限'); window.location.href = '/dashboard.html'; return; }
    loadNodes();
})();
</script>
</body>
</html>
