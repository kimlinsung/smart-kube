<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能云边端调度系统 · 我的资源</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="dashboard">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">

      <div class="stats" id="cluster">
        <div class="stat-tile"><div class="st-body"><div class="st-value"><span class="spinner"></span></div><div class="st-label">加载集群概览…</div></div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>我的 Units / 容器</h2>
          <div class="right">
            <span class="badge badge-blue" id="podCount">—</span>
            <button id="refresh" class="btn-sm btn-ghost">刷新</button>
          </div>
        </div>
        <div class="card-body flush">
          <table>
            <thead>
              <tr><th>名称</th><th>状态</th><th>节点类型</th><th>节点</th><th>架构</th><th>镜像</th><th>SSH</th><th>类型</th><th>操作</th></tr>
            </thead>
            <tbody id="podsBody"><tr class="loading-row"><td colspan="9"><span class="spinner"></span> 加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<input type="file" id="hiddenUpload" style="display:none" />

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chat.js"></script>
<script>
let CURRENT_POD_FOR_UPLOAD = null;

function statTile(cls, ico, value, label) {
    return `<div class="stat-tile">
        <span class="stat-ico ${cls}">${ico}</span>
        <div class="st-body"><div class="st-value">${value}</div><div class="st-label">${label}</div></div>
    </div>`;
}

async function loadCluster() {
    const el = document.getElementById('cluster');
    try {
        const c = await API.clusterInfo();
        el.innerHTML =
            statTile('blue', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z"/></svg>', escapeHtml(c.version), '集群版本') +
            statTile('cloud', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>', c.node_count, '节点总数') +
            statTile('green', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>', c.ready_nodes, '就绪节点') +
            statTile('edge', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v6H4zM4 14h16v6H4z"/></svg>', escapeHtml(c.namespace), '命名空间');
    } catch (e) {
        el.innerHTML = statTile('device', '!', '—', '集群概览加载失败：' + escapeHtml(e.message));
    }
}

function renderPodRow(p) {
    const sshInfo = p.ssh_port
        ? `port:<b>${p.ssh_port}</b> user:${p.ssh_user||'root'} pwd:<code>${escapeHtml(p.ssh_password||'')}</code>`
        : '<span style="color:var(--muted-2)">-</span>';
    return `
        <td><code>${escapeHtml(p.name)}</code></td>
        <td>${badgePhase(p.phase, p.name)}</td>
        <td>${badgeNodeType(p.node_type)}</td>
        <td>${escapeHtml(p.node||'-')}</td>
        <td>${escapeHtml(p.arch||'-')}</td>
        <td style="font-size:12px;">${escapeHtml(p.image||'-')}</td>
        <td style="font-size:12px;">${sshInfo}</td>
        <td><span class="badge badge-blue">${escapeHtml(p.kind||'-')}</span></td>
        <td><div class="row-actions">
            <button class="primary" data-act="shell" data-name="${escapeHtml(p.name)}">Web Shell</button>
            <button data-act="upload" data-name="${escapeHtml(p.name)}">上传</button>
            <button class="danger" data-act="del" data-name="${escapeHtml(p.name)}">删除</button>
        </div></td>`;
}

async function loadPods(silent = false) {
    const body = document.getElementById('podsBody');
    if (!silent) body.innerHTML = '<tr class="loading-row"><td colspan="9"><span class="spinner"></span> 加载中…</td></tr>';
    try {
        const r = await API.listResources();
        document.getElementById('podCount').textContent = (r.pods.length || 0) + ' 个';
        if (!r.pods.length) {
            body.innerHTML = `<tr><td colspan="9"><div class="empty-state">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>
                <div class="t">暂无资源</div><div class="s">点击右上角「AI 助手」，用自然语言创建你的第一个容器。</div>
            </div></td></tr>`;
            return;
        }
        body.innerHTML = '';
        groupByNodeType(r.pods).forEach(({ type, items }) => {
            body.insertAdjacentHTML('beforeend', ntGroupHeaderHTML(type, items.length, 9));
            items.forEach(p => { const tr = document.createElement('tr'); tr.innerHTML = renderPodRow(p); body.appendChild(tr); });
        });
        bindPhaseHover(body);
    } catch (e) {
        if (!silent) body.innerHTML = `<tr><td colspan="9" style="color:var(--danger)">加载失败：${escapeHtml(e.message)}</td></tr>`;
    }
}

document.getElementById('podsBody').addEventListener('click', async e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const act = btn.dataset.act, name = btn.dataset.name;
    if (act === 'del') {
        if (!confirm('确认删除 ' + name + '？')) return;
        try { await API.deleteResource(name); loadPods(); } catch (err) { alert(err.message); }
    } else if (act === 'shell') {
        window.open('/shell.html?pod=' + encodeURIComponent(name), '_blank');
    } else if (act === 'upload') {
        CURRENT_POD_FOR_UPLOAD = name;
        document.getElementById('hiddenUpload').click();
    }
});

document.getElementById('hiddenUpload').onchange = async e => {
    const f = e.target.files[0]; if (!f || !CURRENT_POD_FOR_UPLOAD) return;
    try { const r = await API.uploadToPod(f, CURRENT_POD_FOR_UPLOAD, '/tmp'); alert('已上传到 Units' + r.pod_path); }
    catch (err) { alert('上传失败：' + err.message); }
    e.target.value = '';
};

document.getElementById('refresh').onclick = () => loadPods(true);
window.addEventListener('chat:done', () => loadPods(true));

(async () => {
    await loadMe();
    await loadCluster();
    await loadPods();
    startPolling(() => loadPods(true), 15000);
})();
</script>
</body>
</html>
