<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能云边端调度系统 · 用户管理</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="users">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="card">
        <div class="card-head">
          <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>平台用户</h2>
          <div class="right">
            <span class="badge badge-green" id="onlineCount">0 在线</span>
            <span class="badge badge-blue" id="userCount">-</span>
          </div>
        </div>
        <div class="card-body">
          <div class="form-row">
            <span class="label">新建用户</span>
            <input id="nu" placeholder="用户名" autocomplete="off" />
            <input id="np" placeholder="密码（至少 6 位）" type="password" autocomplete="new-password" />
            <select id="nr" aria-label="用户角色"><option value="user">普通用户</option><option value="admin">管理员</option></select>
            <button id="createUser" class="primary btn-sm">创建</button>
          </div>
          <div class="table-scroll">
            <table>
              <thead><tr><th>ID</th><th>用户名</th><th>在线状态</th><th>角色</th><th>上次登录</th><th>Units</th><th>实验</th><th>创建时间</th><th>操作</th></tr></thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chat.js"></script>
<script>
let MY_ID = null;
const ONLINE_USER_IDS = new Set();
let PRESENCE_READY = false;

function presenceBadge(online) {
    return online
        ? '<span class="badge dot badge-green">在线</span>'
        : '<span class="badge dot badge-muted">离线</span>';
}

function refreshPresenceUI() {
    let visibleOnline = 0;
    document.querySelectorAll('[data-presence-user]').forEach(cell => {
        const online = ONLINE_USER_IDS.has(Number(cell.dataset.presenceUser));
        cell.innerHTML = presenceBadge(online);
        if (online) visibleOnline += 1;
    });
    document.getElementById('onlineCount').textContent = `${visibleOnline} 在线`;
}

window.addEventListener('presence:update', event => {
    const data = event.detail || {};
    if (data.type === 'presence_snapshot') {
        ONLINE_USER_IDS.clear();
        (data.online_user_ids || []).forEach(id => ONLINE_USER_IDS.add(Number(id)));
        PRESENCE_READY = true;
    } else if (data.type === 'presence') {
        const id = Number(data.user_id);
        if (data.online) ONLINE_USER_IDS.add(id); else ONLINE_USER_IDS.delete(id);
        PRESENCE_READY = true;
    } else {
        return;
    }
    refreshPresenceUI();
});

async function loadUsers() {
    const body = document.getElementById('usersBody');
    body.innerHTML = '<tr class="loading-row"><td colspan="9"><span class="spinner"></span> 加载中…</td></tr>';
    try {
        const r = await API.adminUsers();
        document.getElementById('userCount').textContent = `${r.users.length} 人`;
        if (!PRESENCE_READY) {
            ONLINE_USER_IDS.clear();
            r.users.filter(user => user.online).forEach(user => ONLINE_USER_IDS.add(Number(user.id)));
        }
        body.innerHTML = '';
        r.users.forEach(u => {
            const tr = document.createElement('tr');
            const isSelf = u.id === MY_ID;
            const toggleRole = u.role === 'admin' ? 'user' : 'admin';
            const toggleLabel = u.role === 'admin' ? '降为普通用户' : '设为管理员';
            const roleBtn = isSelf ? '' : `<button data-act="role" data-id="${u.id}" data-name="${escapeHtml(u.username)}" data-role="${toggleRole}">${toggleLabel}</button>`;
            tr.innerHTML = `
                <td>${u.id}</td>
                <td>${escapeHtml(u.username)}${isSelf ? ' <span class="badge badge-blue">当前账号</span>' : ''}</td>
                <td data-presence-user="${u.id}">${presenceBadge(ONLINE_USER_IDS.has(Number(u.id)))}</td>
                <td><span class="badge ${u.role === 'admin' ? 'badge-blue' : 'badge-green'}">${u.role === 'admin' ? '管理员' : '普通用户'}</span></td>
                <td style="white-space:nowrap;">${u.last_login_at ? fmtTime(u.last_login_at) : '<span style="color:var(--muted-2)">从未登录</span>'}</td>
                <td><span class="metric-number">${u.unit_count == null ? '-' : u.unit_count}</span></td>
                <td><span class="metric-number">${u.experiment_count || 0}</span></td>
                <td>${fmtTime(u.created_at)}</td>
                <td><div class="row-actions">
                    <button data-act="pwd" data-id="${u.id}" data-name="${escapeHtml(u.username)}">重置密码</button>
                    ${roleBtn}
                    ${u.role === 'admin' ? '' : `<button class="danger" data-act="del" data-id="${u.id}" data-name="${escapeHtml(u.username)}">删除</button>`}
                </div></td>`;
            body.appendChild(tr);
        });
        refreshPresenceUI();
    } catch (e) {
        body.innerHTML = `<tr><td colspan="9" style="color:var(--danger)">${escapeHtml(e.message)}</td></tr>`;
    }
}

document.getElementById('usersBody').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const { act, id, name, role } = btn.dataset;
    if (act === 'del') {
        if (!confirm(`删除用户 ${name}？`)) return;
        try { await API.adminDeleteUser(id); loadUsers(); } catch (err) { alert(err.message); }
    } else if (act === 'pwd') {
        const newPwd = prompt(`为用户 "${name}" 设置新密码（至少 6 位）：`);
        if (newPwd === null) return;
        if (newPwd.length < 6) { alert('密码长度不能少于 6 位'); return; }
        try { await API.adminChangePassword(id, newPwd); alert('密码已修改'); } catch (err) { alert(err.message); }
    } else if (act === 'role') {
        const tip = role === 'admin' ? `将用户 "${name}" 设为管理员？` : `将管理员 "${name}" 降为普通用户？`;
        if (!confirm(tip)) return;
        try { await API.adminSetUserRole(id, role); loadUsers(); } catch (err) { alert(err.message); }
    }
});

document.getElementById('createUser').onclick = async () => {
    const username = document.getElementById('nu').value.trim();
    const password = document.getElementById('np').value;
    const role = document.getElementById('nr').value;
    if (!username || !password) return alert('用户名/密码不能为空');
    if (password.length < 6) return alert('密码长度不能少于 6 位');
    try {
        await API.adminCreateUser(username, password, role);
        document.getElementById('nu').value = '';
        document.getElementById('np').value = '';
        loadUsers();
    } catch (err) { alert(err.message); }
};

(async () => {
    const me = await loadMe();
    if (!me || me.role !== 'admin') { alert('需要管理员权限'); window.location.href = '/dashboard.html'; return; }
    MY_ID = me.id;
    loadUsers();
})();
</script>
</body>
</html>
