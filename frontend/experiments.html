<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能云边端调度系统 · 实验管理</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="experiments">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">

      <header class="experiment-page-heading"><div><span>RESEARCH / EXPERIMENTS</span><h1>实验项目</h1></div><button id="btnNew" class="primary">+ 新建实验</button></header>
      <div class="experiment-filters"><label><input type="search" id="experimentSearch" placeholder="搜索实验名称或所有者" aria-label="搜索实验" /></label><select id="experimentScope" aria-label="实验范围"><option value="all">全部实验</option><option value="mine">我创建的</option><option value="shared">参与协作</option></select><select id="experimentSort" aria-label="实验排序"><option value="new">最近创建</option><option value="name">名称 A–Z</option><option value="resources">资源数量</option></select></div>
      <div class="toolbar experiment-list-toolbar">
        <div class="left"><span id="expHint"><span class="spinner"></span> 加载中…</span></div>
        <div class="right"><label><input type="checkbox" id="selectPage" /> 本页全选</label><button id="deleteSelected" class="danger" disabled>删除所选 (0)</button></div>
      </div>
      <div class="experiment-table-wrap"><table class="experiment-table"><thead><tr><th></th><th>实验名称</th><th>所有者 / 权限</th><th>计算资源</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="expGrid"></tbody></table></div>
      <div id="expPagination" class="exp-pagination" style="display:none;"></div>

    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/collaboration.js"></script>
<script src="/js/chat.js"></script>
<script>
const PAGE_SIZE = 18;
let ALL_EXPS = [];
let CURRENT_EXP_ID = null;
let PAGE = 1;
const SELECTED = new Set();
let deleting = false;
const canDelete = exp => exp.access_role !== 'collaborator' && (exp.user_id === ME?.id || ME?.role === 'admin');
function filteredExperiments() {
    const query = document.getElementById('experimentSearch').value.trim().toLowerCase();
    const scope = document.getElementById('experimentScope').value, sort = document.getElementById('experimentSort').value;
    return ALL_EXPS.filter(exp => `${exp.name} ${exp.owner_username || ''}`.toLowerCase().includes(query)
        && (scope === 'all' || (scope === 'mine' ? exp.user_id === ME?.id : exp.access_role === 'collaborator')))
        .sort((a, b) => sort === 'name' ? a.name.localeCompare(b.name) : sort === 'resources' ? b.total_count - a.total_count : b.created_at - a.created_at);
}
function updateSelection() {
    const items = filteredExperiments().slice((PAGE - 1) * PAGE_SIZE, PAGE * PAGE_SIZE).filter(canDelete);
    const count = items.filter(exp => SELECTED.has(exp.id)).length;
    document.getElementById('selectPage').checked = items.length > 0 && count === items.length;
    document.getElementById('selectPage').indeterminate = count > 0 && count < items.length;
    document.getElementById('selectPage').disabled = deleting || !items.length;
    document.getElementById('deleteSelected').textContent = deleting ? '正在删除…' : `删除所选 (${SELECTED.size})`;
    document.getElementById('deleteSelected').disabled = deleting || !SELECTED.size;
}

function fmtCount(label, n, cls) { return `<span class="badge ${cls}">${label} ${n}</span>`; }

function renderCard(exp) {
    const isCurrent = exp.id === CURRENT_EXP_ID;
    const isMine = ME && exp.user_id === ME.id;
    const isCollaborator = exp.access_role === 'collaborator';
    const canManage = !isCollaborator && (isMine || (ME && ME.role === 'admin'));
    return `
      <tr class="experiment-row ${isCurrent ? 'current' : ''}">
          <td>${canManage ? `<input type="checkbox" data-select="${exp.id}" aria-label="选择 ${escapeHtml(exp.name)}" ${SELECTED.has(exp.id) ? 'checked' : ''} ${deleting ? 'disabled' : ''} />` : ''}</td>
          <td><a class="experiment-name" href="/experiment_detail.html?id=${exp.id}">${icon('experiments')}<span>${escapeHtml(exp.name)}</span></a><small class="experiment-id">EXP-${String(exp.id).padStart(4, '0')} ${isCurrent ? '<span class="current-tag">当前</span>' : ''}</small></td>
          <td><span>${escapeHtml(exp.owner_username || ME?.username || '-')}</span><small class="experiment-id">${isCollaborator ? '只读协作' : isMine ? '所有者' : '管理员'}</small></td>
          <td><div class="experiment-resources">
              ${fmtCount('云', exp.cloud_count, 'badge-cloud')}
              ${fmtCount('边', exp.edge_count, 'badge-edge')}
              ${fmtCount('端', exp.device_count, 'badge-device')}
          </div></td>
          <td><time>${fmtTime(exp.created_at)}</time></td>
          <td><div class="row-actions">
              ${canManage ? `<button data-act="share" data-id="${exp.id}" data-name="${escapeHtml(exp.name)}">协作分享</button>` : ''}
              ${canManage ? `<button class="primary" data-act="enter" data-id="${exp.id}">${isCurrent ? '已进入' : '进入'}</button>` : ''}
              ${canManage ? `<button class="danger" data-act="del" data-id="${exp.id}" data-name="${escapeHtml(exp.name)}">删除</button>` : ''}
          </div></td>
      </tr>`;
}

function renderPagination(total) {
    const el = document.getElementById('expPagination');
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (totalPages <= 1) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.innerHTML = `
        <button id="prevPage" ${PAGE <= 1 ? 'disabled' : ''}>上一页</button>
        <span>第 ${PAGE} / ${totalPages} 页（共 ${total} 个）</span>
        <button id="nextPage" ${PAGE >= totalPages ? 'disabled' : ''}>下一页</button>`;
    document.getElementById('prevPage').onclick = () => { PAGE--; render(); };
    document.getElementById('nextPage').onclick = () => { PAGE++; render(); };
}

function render() {
    const filtered = filteredExperiments();
    PAGE = Math.min(PAGE, Math.max(1, Math.ceil(filtered.length / PAGE_SIZE)));
    updateSelection();
    const grid = document.getElementById('expGrid');
    const hint = document.getElementById('expHint');
    if (!filtered.length) {
        grid.innerHTML = `<tr><td colspan="6"><div class="empty-state">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L5.2 18a2 2 0 0 0 1.8 3h10a2 2 0 0 0 1.8-3L14 9.5V3"/></svg>
            <div class="t">${ALL_EXPS.length ? '没有符合条件的实验' : '暂无实验'}</div>
        </div></td></tr>`;
        hint.textContent = ME && ME.role === 'admin' ? '管理员视图：所有用户的实验' : '我的与协作实验';
        document.getElementById('expPagination').style.display = 'none';
        return;
    }
    hint.textContent = (ME && ME.role === 'admin' ? '管理员视图：所有用户的实验' : '我的与协作实验') + `（共 ${ALL_EXPS.length} 个）`;
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (PAGE > totalPages) PAGE = totalPages;
    const start = (PAGE - 1) * PAGE_SIZE;
    grid.innerHTML = filtered.slice(start, start + PAGE_SIZE).map(renderCard).join('');
    renderPagination(filtered.length);
}

async function loadExperiments() {
    try {
        const r = await API.listExperiments();
        ALL_EXPS = r.experiments || [];
        for (const id of SELECTED) if (!ALL_EXPS.some(exp => exp.id === id && canDelete(exp))) SELECTED.delete(id);
        CURRENT_EXP_ID = r.current_experiment_id || null;
        render();
    } catch (e) {
        document.getElementById('expGrid').innerHTML =
            `<tr><td colspan="6" style="color:var(--danger);padding:40px;text-align:center;">加载失败：${escapeHtml(e.message)}</td></tr>`;
    }
}

document.getElementById('expGrid').addEventListener('click', async e => {
    const trigger = e.target.closest('[data-act]'); if (!trigger) return;
    const { act, id, name } = trigger.dataset;
    if (act === 'share') { Collaboration.open(Number(id), name); return; }
    if (act === 'view') { window.location.href = '/experiment_detail.html?id=' + encodeURIComponent(id); return; }
    if (act === 'enter') {
        if (Number(id) === CURRENT_EXP_ID) return;
        try {
            await API.enterExperiment(id);
            const me = await API.me(); renderShell(me); ME = me; CURRENT_EXP_ID = me.current_experiment_id;
            render(); window.dispatchEvent(new CustomEvent('experiment:changed'));
        } catch (err) { alert('进入失败：' + err.message); }
    } else if (act === 'del') {
        if (deleting || !confirm(`确认删除实验「${name}」？\n所有容器、关联工作区、上传文件、生成代码、报告与过程记录都会被删除，且不可恢复。`)) return;
        try {
            const r = await API.deleteExperiment(id);
            const me = await API.me(); renderShell(me); ME = me; CURRENT_EXP_ID = me.current_experiment_id;
            await loadExperiments(); window.dispatchEvent(new CustomEvent('experiment:changed'));
            const n = (r.deleted_pods || []).length; if (n) alert(`已删除实验，并清理了 ${n} 个容器`);
        } catch (err) { alert('删除失败：' + err.message); }
    }
});

document.getElementById('btnNew').onclick = async () => {
    const name = prompt('新实验名称：', `实验-${new Date().toLocaleString('zh-CN', { hour12: false })}`);
    if (name === null) return;
    try {
        await API.createExperiment(name.trim() || '未命名实验', '');
        const me = await API.me(); renderShell(me); ME = me; CURRENT_EXP_ID = me.current_experiment_id;
        await loadExperiments(); window.dispatchEvent(new CustomEvent('experiment:changed'));
    } catch (err) { alert('创建失败：' + err.message); }
};

document.getElementById('expGrid').addEventListener('change', event => {
    const id = Number(event.target.dataset.select);
    if (!id) return;
    event.target.checked ? SELECTED.add(id) : SELECTED.delete(id);
    updateSelection();
});
document.getElementById('selectPage').onchange = event => {
    filteredExperiments().slice((PAGE - 1) * PAGE_SIZE, PAGE * PAGE_SIZE).filter(canDelete).forEach(exp => {
        event.target.checked ? SELECTED.add(exp.id) : SELECTED.delete(exp.id);
    });
    render();
};
document.getElementById('deleteSelected').onclick = async () => {
    const ids = [...SELECTED];
    if (deleting || !ids.length || !confirm(`彻底删除选中的 ${ids.length} 个实验？\n包括容器、工作区、上传文件、生成代码和报告，不可恢复。`)) return;
    deleting = true; render();
    try {
        const failures = [];
        for (let i = 0; i < ids.length; i += 50) {
            const result = await API.deleteExperiments(ids.slice(i, i + 50));
            for (const item of result.results) {
                if (item.ok) SELECTED.delete(item.id); else failures.push(`#${item.id}: ${item.error}`);
            }
        }
        ME = await API.me(); renderShell(ME);
        await loadExperiments();
        window.dispatchEvent(new CustomEvent('experiment:changed'));
        if (failures.length) alert('以下实验未删除：\n' + failures.join('\n'));
    } catch (error) { alert('删除未完成：' + error.message); }
    finally { deleting = false; render(); }
};
window.addEventListener('task:update', event => {
    if (event.detail?.kind === 'chat' && ['succeeded', 'failed'].includes(event.detail.status)) loadExperiments();
});
document.getElementById('experimentSearch').oninput = () => { PAGE = 1; render(); };
document.getElementById('experimentScope').onchange = () => { PAGE = 1; render(); };
document.getElementById('experimentSort').onchange = () => { PAGE = 1; render(); };

(async () => {
    ME = await loadMe();
    if (!ME) return;
    await loadExperiments();
})();
</script>
</body>
</html>
