<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能云边端调度系统 · 全部 Units</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="all_units">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="card">
        <div class="card-head">
          <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>所有用户的 Units</h2>
          <div class="right">
            <span class="badge badge-blue" id="unitCount">-</span>
            <button id="refreshUnits" class="btn-sm btn-ghost">刷新</button>
          </div>
        </div>
        <div class="card-body flush table-scroll">
          <table>
            <thead><tr><th>名称</th><th>所属</th><th>状态</th><th>节点类型</th><th>节点</th><th>架构</th><th>类型</th><th>操作</th></tr></thead>
            <tbody id="podsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chat.js"></script>
<script>
async function loadAllPods(silent = false) {
    const body = document.getElementById('podsBody');
    if (!silent) body.innerHTML = '<tr class="loading-row"><td colspan="8"><span class="spinner"></span> 加载中…</td></tr>';
    try {
        const r = await API.adminPods();
        document.getElementById('unitCount').textContent = `${r.pods.length} 个`;
        body.innerHTML = '';
        if (!r.pods.length) {
            body.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="t">暂无 Units</div></div></td></tr>';
            return;
        }
        groupByNodeType(r.pods).forEach(({ type, items }) => {
            body.insertAdjacentHTML('beforeend', ntGroupHeaderHTML(type, items.length, 8));
            items.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code>${escapeHtml(p.name)}</code></td>
                    <td>${escapeHtml(p.owner_username || '-')}</td>
                    <td>${badgePhase(p.phase, p.name)}</td>
                    <td>${badgeNodeType(p.node_type)}</td>
                    <td>${escapeHtml(p.node || '-')}</td>
                    <td>${escapeHtml(p.arch || '-')}</td>
                    <td><span class="badge badge-blue">${escapeHtml(p.kind || '-')}</span></td>
                    <td><div class="row-actions"><button class="danger" data-name="${escapeHtml(p.name)}">删除</button></div></td>`;
                body.appendChild(tr);
            });
        });
        bindPhaseHover(body);
    } catch (e) {
        if (!silent) body.innerHTML = `<tr><td colspan="8" style="color:var(--danger)">${escapeHtml(e.message)}</td></tr>`;
    }
}

document.getElementById('podsBody').addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const name = btn.dataset.name;
    if (!confirm(`确认删除 Unit ${name}？`)) return;
    try { await API.deleteResource(name); loadAllPods(); } catch (err) { alert(err.message); }
});
document.getElementById('refreshUnits').onclick = () => loadAllPods();

(async () => {
    const me = await loadMe();
    if (!me || me.role !== 'admin') { alert('需要管理员权限'); window.location.href = '/dashboard.html'; return; }
    loadAllPods();
    startPolling(() => loadAllPods(true), 15000);
})();
</script>
</body>
</html>
