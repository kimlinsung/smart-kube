<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能云边端调度系统 · 操作日志</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="logs">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">

      <div class="card">
        <div class="card-head">
          <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2M8 11h8M8 15h6"/></svg>操作日志</h2>
          <div class="right">
            <span class="card-head sub" style="border:0;padding:0;">管理员可见全部，普通用户仅可见自己的</span>
            <button id="refresh" class="btn-sm btn-ghost">刷新</button>
          </div>
        </div>
        <div class="card-body flush">
          <table>
            <thead><tr><th>时间</th><th>用户</th><th>动作</th><th>详情</th></tr></thead>
            <tbody id="body"><tr class="loading-row"><td colspan="4"><span class="spinner"></span> 加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chat.js"></script>
<script>
async function load() {
    const body = document.getElementById('body');
    body.innerHTML = '<tr class="loading-row"><td colspan="4"><span class="spinner"></span> 加载中…</td></tr>';
    try {
        const r = await API.logs();
        body.innerHTML = '';
        r.logs.forEach(l => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="white-space:nowrap;color:var(--muted);">${fmtTime(l.created_at)}</td>
                <td>${escapeHtml(l.username||'-')}</td>
                <td><span class="badge badge-blue">${escapeHtml(l.action)}</span></td>
                <td style="font-size:12.5px;color:var(--text-2);">${escapeHtml(l.detail||'')}</td>`;
            body.appendChild(tr);
        });
        if (!r.logs.length) body.innerHTML = `<tr><td colspan="4"><div class="empty-state"><div class="t">暂无日志</div></div></td></tr>`;
    } catch (e) { body.innerHTML = `<tr><td colspan="4" style="color:var(--danger)">${escapeHtml(e.message)}</td></tr>`; }
}
document.getElementById('refresh').onclick = load;
(async () => { await loadMe(); load(); })();
</script>
</body>
</html>
